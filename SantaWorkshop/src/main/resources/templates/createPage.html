<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create</title>
    <link rel="stylesheet" th:href="@{/css/createStyle.css}">

</head>
<body>

<h2>Create</h2>

<!-- 🔽 TYPE SELECTOR -->
<label>
    What do you want to create?
    <select id="createType" onchange="toggleForm()">
        <option value="">Choose</option>
        <option value="gift">Gift</option>
        <option value="elf">Elf</option>
        <option value="delivery">Delivery</option>
    </select>
</label>

<hr/>

<!-- 🎁 GIFT FORM -->
<div id="giftForm" style="display:none">
    <h3>Create Gift</h3>
    <form th:action="@{/createPage/gift}" method="post">

        <label>
            Name
            <input type="text" name="giftName" required/>
        </label>

        <label>
            Category
            <select name="category" required>
                <option value="TOY">TOY</option>
                <option value="BOOK">BOOK</option>
                <option value="GADGET">GADGET</option>
                <option value="CLOTHES">CLOTHES</option>
                <option value="OTHER">OTHER</option>
            </select>
        </label>

        <label>
            Target Age
            <input type="number" name="targetAge" min="0" max="99"/>
        </label>

        <button type="submit">Create Gift</button>
    </form>
</div>

<!-- 🧝 ELF FORM -->
<div id="elfForm" style="display:none">
    <h3>Create Elf</h3>
    <form th:action="@{/createPage/elf}" method="post">

        <label>
            Name
            <input type="text" name="elfName" required/>
        </label>

        <label>
            Skill Level
            <select name="elfLevel">
                <option value="JUNIOR">JUNIOR</option>
                <option value="MID">MID</option>
                <option value="SENIOR">SENIOR</option>
            </select>
        </label>

        <button type="submit">Create Elf</button>
    </form>
</div>

<!-- 🚚 DELIVERY FORM -->
<div id="deliveryForm" style="display:none">
    <h3>Create Delivery</h3>
    <form th:action="@{/createPage/delivery}" method="post">

        <label>
            Recipient Name
            <input type="text" name="recipientName" required/>
        </label>

        <label>
            Address
            <input type="text" name="address" required/>
        </label>

        <label>
            Gift
            <select name="giftId" required>
                <option value="">Choose gift</option>
                <option th:each="gift : ${gifts}"
                        th:value="${gift.id}"
                        th:text="${gift.name}">
                </option>
            </select>
        </label>

        <label>
            Elf
            <select name="elfId" required>
                <option value="">Choose elf</option>
                <option th:each="elf : ${elves}"
                        th:value="${elf.id}"
                        th:text="${elf.name}">
                </option>
            </select>
        </label>

        <label>
            Delivery Date
            <input type="date" name="deliveryDate" required/>
        </label>

        <button type="submit">Create Delivery</button>
    </form>
</div>
<script src="/js/create.js"></script>
</body>
</html>
