<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delivery List</title>
    <link rel="stylesheet" th:href="@{/css/deliveryStyle.css}">
</head>
<body>
<div id="delivery-container">
    <main id="main-content">

        <section class="delivery-section">
            <h2>Deliveries</h2>
            <form method="get" th:action="@{/deliveries}">
                <label>
                    Filter by status:
                    <select name="status" onchange="this.form.submit()">
                        <option value="">All</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${s == selectedStatus}">
                        </option>
                    </select>
                </label>
            </form>
            <div class="delivery-list">

                <div class="delivery-header">
                    <span>Tracking Code</span>
                    <span>Recipient</span>
                    <span>Address</span>
                    <span>Gifts</span>
                    <span>Elf</span>
                    <span>Status</span>
                    <span>Arrival</span>
                    <span>Actions</span>
                </div>

                <div class="delivery-row"
                     th:each="delivery : ${deliveryList}"
                     th:attr="data-id=${delivery.id}">

                    <span th:text="${delivery.trackingCode}"></span>
                    <span th:text="${delivery.recipientName}"></span>
                    <span th:text="${delivery.address}"></span>

                    <!-- Gifts list -->
                    <span>
                        <ul>
                            <li th:each="gift : ${delivery.gifts}"
                                th:text="${gift.name}">
                            </li>
                        </ul>
                    </span>

                    <span th:text="${delivery.elf.name}"></span>
                    <span th:text="${delivery.deliveryStatus}"></span>
                    <span th:text="${delivery.estimatedArrival}"></span>

                    <!-- ACTIONS -->
                    <div class="actions">

                        <!-- Status update -->
                        <form th:action="@{/api/deliveries/{id}/status(id=${delivery.id})}"
                              method="post"
                              th:method="patch">

                            <select name="deliveryStatus">
                                <option th:each="s : ${T(sirma.SantaWorkshop.entity.enums.DeliveryStatus).values()}"
                                        th:value="${s}"
                                        th:selected="${s == delivery.deliveryStatus}"
                                        th:text="${s}">
                                </option>
                            </select>

                            <button type="submit">UPDATE</button>
                        </form>

                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
